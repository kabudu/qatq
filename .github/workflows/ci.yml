name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject em dashes
        run: python3 scripts/check_no_em_dash.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Test
        run: cargo test --all-features
      - name: Verify KV geometry evidence
        run: python3 scripts/verify_kv_geometry_corpus.py
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml
      - name: Verify public fixtures
        run: cargo run --bin qatq -- fixture verify --manifest fixtures/public.manifest --output docs/PUBLIC_FIXTURE_AUDIT.ci.md
      - name: Public production gate
        run: >
          cargo run --release --bin qatq-bench -- --exact-only --no-synthetic
          --manifest fixtures/public.manifest
          --gate-output docs/PUBLIC_BENCHMARK_GATE.ci.md
          --gate-require-external
          --gate-policy production-kv
          --max-exact-ratio 0.96
          --max-exact-encode-us 5000
          --max-exact-decode-ns-per-value 50.00
          --max-exact-container-ratio 0.97
          --max-exact-container-decode-ns-per-value 50.00
      - name: Public competitive compression gate
        run: >
          cargo run --release --bin qatq-bench -- --exact-only --no-synthetic
          --manifest fixtures/public.manifest
          --gate-output docs/PUBLIC_COMPETITIVE_COMPRESSION_GATE.ci.md
          --gate-require-external
          --gate-policy competitive-compression
      - name: Package
        run: cargo package --allow-dirty

  independent-oracle-validation:
    name: independent Oracle validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce every finite certificate row with SageMath
        run: scripts/run_oracle_independent_validation.sh "$RUNNER_TEMP/oracle-evidence"
      - name: Compare with published machine-readable results
        run: >
          python3 scripts/oracle_validation/compare_results.py
          --expected validation/oracle-v0.4.1/evidence/results.json
          --actual "$RUNNER_TEMP/oracle-evidence/results.json"
