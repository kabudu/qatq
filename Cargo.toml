[package]
name = "qatq"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
default-run = "qatq"
description = "Exact tensor-aware compression for LLM KV caches and runtime migration"
license = "Apache-2.0"
repository = "https://github.com/kabudu/qatq"
readme = "README.md"
keywords = ["quantization", "kv-cache", "llm", "compression", "quaternion"]
categories = ["compression", "science"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "SUPPORT.md",
    "CODE_OF_CONDUCT.md",
    "assets/**",
    "src/**",
    "examples/**",
    "adapters/**",
    "tests/**",
    "scripts/**",
    "docs/ARCHITECTURE.md",
    "docs/oracle/**",
    "docs/CREDITS.md",
    "docs/FIXTURES.md",
    "docs/API_CLI_FREEZE.md",
    "docs/BRAND.md",
    "docs/EXTERNAL_RUNTIME_EVIDENCE.md",
    "docs/PRODUCTION_READINESS.md",
    "docs/PUBLIC_*.md",
    "docs/PUBLIC_COMPARATIVE_*.md",
    "docs/PAPER_REFRESH_NOTES.md",
    "docs/WHITEPAPER_RESULTS.md",
    "docs/VALIDATION.md",
    "docs/RUNTIME_*.md",
    "docs/LLAMA_CPP_*.md",
    "docs/NATIVE_U16_PREDICTOR_EXPERIMENT.md",
    "docs/CROSS_CHUNK_XOR_EXPERIMENT.md",
    "docs/RELEASE_CHECKLIST.md",
    "docs/WHITEPAPER.md",
    "fixtures/public.manifest",
    "fixtures/generated/**",
]

[lib]
name = "qatq"
path = "src/lib.rs"

[[bin]]
name = "qatq"
path = "src/main.rs"

[[bin]]
name = "qatq-oracle"
path = "src/bin/qatq-oracle.rs"
required-features = ["oracle"]

[features]
default = []
oracle = ["dep:num-bigint", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
lz4_flex = "0.14.0"
zstd = "0.13.3"
num-bigint = { version = "0.4.6", features = ["serde"], optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }
sha2 = { version = "0.10.8", optional = true }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
